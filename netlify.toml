# Netlify configuration for the Salpakan client.
# The client is a plain static SPA (no client-side routing), so a simple
# publish of `client/dist` is all that's required.
[build]
  # Netlify's automatic dependency install runs in the base directory (the repo
  # root), which only has `concurrently`. The client's own dependencies (vite,
  # typescript, react, ...) live in client/, so install them explicitly here
  # before building — otherwise the build fails with `tsc: command not found`
  # (exit code 127).
  command = "npm ci --prefix client && npm --prefix client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# Point the client at the deployed backend (Render). Set as a build-time env var
# so it's baked into the bundle at deploy time.
[env]
  # VITE_SERVER_URL is intentionally not set here — configure it in the Netlify
  # dashboard (Build & deploy → Environment variables) with your Render URL.
  # e.g. VITE_SERVER_URL=https://your-backend.onrender.com
