<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom-friendly viewport: no maximum-scale, pinch-zoom allowed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Salpakan — Game of the Generals. Online 1v1 tactics: hidden ranks, fog of war, capture the flag." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AF%3C/text%3E%3C/svg%3E" />
    <title>Salpakan — Game of the Generals</title>
    <script>
      // Pre-paint theme: reads the same key as useTheme.tsx ('salpakan-theme')
      // and toggles .dark on <html> before first paint to avoid a flash.
      // The design language is dark-first, so dark is the default.
      (function () {
        try {
          var t = localStorage.getItem('salpakan-theme');
          var dark = t ? t === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
